Foreground yes
DatabaseDirectory /var/lib/clamav
# The app and freshclam use loopback TCP. Do not require a writable /run socket directory.
TCPSocket 3310
TCPAddr 127.0.0.1
LogFile /dev/null
LogClean no
LogVerbose no
LogTime no
MaxThreads 1
MaxQueue 2
StreamMaxLength 6M
MaxScanSize 40M
MaxFileSize 20M
MaxRecursion 8
MaxFiles 100
MaxScanTime 12000
AlertExceedsMax yes
ReadTimeout 15
CommandReadTimeout 10
SendBufTimeout 1000
SelfCheck 300

