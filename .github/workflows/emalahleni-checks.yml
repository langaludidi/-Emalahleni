name: Emalahleni build and browser checks
on:
  push:
    paths: ['emalahleni-app/**', '.github/workflows/emalahleni-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  NEXT_TELEMETRY_DISABLED: '1'
  WRANGLER_SEND_METRICS: 'false'
jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        check: [typecheck, test]
    defaults:
      run:
        working-directory: emalahleni-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: emalahleni-app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run ${{ matrix.check }}
  database:
    name: PostgreSQL concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vectra_ci
          POSTGRES_PASSWORD: synthetic-ci-postgres-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d vectra_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: emalahleni-app
    env:
      CI: 'true'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: vectra_ci
      PGUSER: postgres
      PGPASSWORD: synthetic-ci-postgres-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: emalahleni-app/package-lock.json
      - run: npm ci --no-audit --no-fund
      # These share a disposable fixture schema, so their setup remains ordered.
      - run: node --import tsx tests/upload-concurrency.ts
      - run: node --import tsx tests/review-concurrency.ts
  project_database:
    name: Housing project permissions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vectra_ci
          POSTGRES_PASSWORD: synthetic-ci-postgres-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d vectra_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: emalahleni-app
    env:
      CI: 'true'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: vectra_ci
      PGUSER: postgres
      PGPASSWORD: synthetic-ci-postgres-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: emalahleni-app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node --import tsx tests/project-creation.ts
  browser:
    name: Build and browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: emalahleni-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: emalahleni-app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emalahleni-browser-review
          path: emalahleni-app/review/
          if-no-files-found: ignore
          retention-days: 7
  verify:
    # Preserve the existing aggregate check name while the work runs in parallel.
    if: always()
    needs: [checks, database, project_database, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
          PROJECT_DATABASE_RESULT: ${{ needs.project_database.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$CHECKS_RESULT" = success && test "$DATABASE_RESULT" = success && test "$PROJECT_DATABASE_RESULT" = success && test "$BROWSER_RESULT" = success
