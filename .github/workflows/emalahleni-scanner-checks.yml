name: Emalahleni private scanner checks
on:
  push:
    paths: ['emalahleni-app/scanner/**', '.github/workflows/emalahleni-scanner-checks.yml']
  pull_request:
    paths: ['emalahleni-app/scanner/**', '.github/workflows/emalahleni-scanner-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: emalahleni-app/scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng poppler-utils util-linux
      # The bridge fixture imports the real app scan caller as well as the scanner SDK.
      # Root prepare installs the pinned SDK, so one install covers both workspaces.
      - run: npm ci --no-audit --no-fund
        working-directory: emalahleni-app
      - run: npm test && npm run typecheck
      - run: docker build --platform linux/amd64 -t emalahleni-scanner-test .
      - run: docker run -d --name emalahleni-scanner-test --memory 4g --cpus 0.5 --mount type=bind,src="$PWD",dst=/contract,readonly --env SCANNER_TOKEN=synthetic-scanner-integration-token-00000000 emalahleni-scanner-test
      - run: docker exec emalahleni-scanner-test node /contract/test/clamav-integration.mjs
      - if: always()
        run: docker rm -f emalahleni-scanner-test
      - run: node scanner/test/worker-integration.mjs
        working-directory: emalahleni-app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emalahleni-scanner-worker-log
          path: emalahleni-app/review/scanner-worker-integration.log
          if-no-files-found: ignore
          retention-days: 3
